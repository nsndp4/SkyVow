spring.application.name=skyvow

spring.datasource.url=jdbc:mysql://localhost:3306/skyvow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=sandeep
spring.datasource.password=toor
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# = JPA & Hibernate Settings =

# Automatically create or update tables based on entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Optional: format SQL output nicely
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.jdbc=INFO

